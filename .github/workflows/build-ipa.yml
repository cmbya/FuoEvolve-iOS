name: 构建并发布 iOS 未签名 IPA
on:
  schedule:
    # UTC 06:00 = Asia/Shanghai 14:00.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 填写 latest 获取最新正式版，或填写上游正式发布标签，例如 1.6.3
        default: latest
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: fuoevolve-release
  cancel-in-progress: false
jobs:
  check:
    name: 检查上游版本
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      version: ${{ steps.select.outputs.version }}
      build: ${{ steps.select.outputs.build }}
    steps:
      - name: 检查上游正式版本及已有安装包
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.upstream_ref || 'latest' }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" = latest ]; then
            RELEASE=$(gh api repos/feeluown/FuoEvolve/releases/latest)
          else
            RELEASE=$(gh api "repos/feeluown/FuoEvolve/releases/tags/$REQUESTED")
          fi
          export RELEASE
          TAG=$(python3 -c 'import os,json; r=json.loads(os.environ["RELEASE"]); assert not r["draft"] and not r["prerelease"]; print(r["tag_name"])')
          VERSION=${TAG#v}
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]
          export VERSION
          EXISTING=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          export EXISTING
          BUILD=$(python3 -c 'import json,os; name="FuoEvolve-"+os.environ["VERSION"]+"-iOS-unsigned.ipa"; found=any(r["tag_name"]==os.environ["VERSION"] and not r["draft"] and any(a["name"]==name and a["state"]=="uploaded" and a["size"]>0 for a in r["assets"]) for page in json.loads(os.environ["EXISTING"]) for r in page); print("false" if found else "true")')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Upstream=$TAG; build required=$BUILD" >> "$GITHUB_STEP_SUMMARY"
  build:
    name: 构建并发布安装包
    needs: check
    if: needs.check.outputs.build == 'true'
    # Standard Intel runner has 14 GB RAM; target remains iPhone ARM64.
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: 获取上游源码
        uses: actions/checkout@v5
        with:
          repository: feeluown/FuoEvolve
          ref: ${{ needs.check.outputs.tag }}
          path: upstream
          fetch-depth: 0
          persist-credentials: false
      - name: 确认上游版本
        id: version
        working-directory: upstream
        env:
          RESOLVED_TAG: ${{ needs.check.outputs.tag }}
          RESOLVED_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # Keep the release selected by check; multiple tags may share HEAD.
          VERSION="$RESOLVED_VERSION"
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]
          test "${RESOLVED_TAG#v}" = "$VERSION"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RESOLVED_TAG}^{commit}")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "UPSTREAM_VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          p=Path('iosApp/FuoEvolve/Info.plist')
          d=plistlib.loads(p.read_bytes())
          d['CFBundleShortVersionString']=os.environ['RESOLVED_VERSION']
          p.write_bytes(plistlib.dumps(d))
          PY
      - name: 应用 iOS 登录修复补丁
        run: python3 scripts/patch-provider-login.py upstream
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('upstream/gradle/libs.versions.toml') }}
      - name: 配置 Kotlin 构建内存
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8' 'org.gradle.workers.max=2' > ~/.gradle/gradle.properties
          sysctl hw.memsize
          cat ~/.gradle/gradle.properties
      - name: 准备官方 iOS 图标
        run: |
          python3 scripts/prepare-icon.py upstream
          ICON=upstream/iosApp/FuoEvolve/Assets.xcassets/AppIcon.appiconset
          sips -s format bmp "$ICON/source.png" --out "$RUNNER_TEMP/icon.bmp"
          sips -s format png "$RUNNER_TEMP/icon.bmp" --out "$ICON/AppIcon.png"
          rm "$ICON/source.png"
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$ICON/AppIcon.png"
          plutil -lint upstream/iosApp/FuoEvolve.xcodeproj/project.pbxproj
      - name: 计算兼容构建缓存标识
        id: build-cache
        run: python3 scripts/cache-identity.py
      - name: 恢复兼容构建缓存
        id: outputs-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            upstream/**/build
            upstream/.gradle
            !upstream/.gradle/configuration-cache
          key: ${{ steps.build-cache.outputs.key }}
          restore-keys: ${{ steps.build-cache.outputs.prefix }}
      - name: 记录缓存匹配结果
        run: |
          mkdir -p logs
          printf 'exact=%s\nrestored_key=%s\n' '${{ steps.outputs-cache.outputs.cache-hit }}' '${{ steps.outputs-cache.outputs.cache-matched-key }}' | tee logs/module-cache.txt
      - name: 构建并打包 iPhone 应用
        run: |
          START=$(date +%s)
          bash scripts/build-ipa.sh
          ELAPSED=$(( $(date +%s) - START ))
          printf 'build_and_package_seconds=%s\nexact_cache_hit=%s\n' "$ELAPSED" '${{ steps.outputs-cache.outputs.cache-hit }}' | tee output/timing.txt
      - name: 保存构建缓存
        if: success() && steps.outputs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            upstream/**/build
            upstream/.gradle
            !upstream/.gradle/configuration-cache
          key: ${{ steps.build-cache.outputs.key }}
      - name: 上传 IPA 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: FuoEvolve-iOS-unsigned
          path: output/*
          if-no-files-found: error
      - name: 发布未签名 IPA
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="$VERSION"
          { printf '未签名 iPhone ARM64 IPA。包含 iOS 图标及网页登录修复，真机登录功能待用户验证。\n\n'; cat output/build-info.txt; } > release-notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite assets.'
            exit 1
          fi
          gh release create "$TAG" output/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FuoEvolve $VERSION iOS" --notes-file release-notes.md --prerelease --latest=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/*
          if-no-files-found: ignore
