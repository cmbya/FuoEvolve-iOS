name: Build unsigned FuoEvolve IPA
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream tag, branch or commit
        default: 7e271c262c6c5495be5d1b680748ac4ba9e5bf0e
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    # Standard Intel runner has 14 GB RAM; target remains iPhone ARM64.
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Fetch upstream source
        uses: actions/checkout@v5
        with:
          repository: feeluown/FuoEvolve
          ref: ${{ inputs.upstream_ref }}
          path: upstream
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve upstream version
        id: version
        working-directory: upstream
        run: |
          TAG=$(git describe --tags --abbrev=0 HEAD)
          VERSION=${TAG#v}
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "UPSTREAM_VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          p=Path('iosApp/FuoEvolve/Info.plist')
          d=plistlib.loads(p.read_bytes())
          d['CFBundleShortVersionString']=os.environ.get('RESOLVED_VERSION', '') or __import__('subprocess').check_output(['git','describe','--tags','--abbrev=0','HEAD'],text=True).strip().removeprefix('v')
          p.write_bytes(plistlib.dumps(d))
          PY
      - name: Apply guarded iOS provider login fixes
        run: python3 scripts/patch-provider-login.py upstream
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('upstream/gradle/libs.versions.toml') }}
      - name: Configure Kotlin link memory
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8' 'org.gradle.workers.max=2' > ~/.gradle/gradle.properties
          sysctl hw.memsize
          cat ~/.gradle/gradle.properties
      - name: Prepare official iOS icon
        run: |
          python3 scripts/prepare-icon.py upstream
          ICON=upstream/iosApp/FuoEvolve/Assets.xcassets/AppIcon.appiconset
          sips -s format bmp "$ICON/source.png" --out "$RUNNER_TEMP/icon.bmp"
          sips -s format png "$RUNNER_TEMP/icon.bmp" --out "$ICON/AppIcon.png"
          rm "$ICON/source.png"
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$ICON/AppIcon.png"
          plutil -lint upstream/iosApp/FuoEvolve.xcodeproj/project.pbxproj
      - name: Identify compatible module cache
        id: build-cache
        run: python3 scripts/cache-identity.py
      - name: Restore compatible module outputs
        id: outputs-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            upstream/**/build
            upstream/.gradle
            !upstream/.gradle/configuration-cache
          key: ${{ steps.build-cache.outputs.key }}
          restore-keys: ${{ steps.build-cache.outputs.prefix }}
      - name: Record module cache match
        run: |
          mkdir -p logs
          printf 'exact=%s\nrestored_key=%s\n' '${{ steps.outputs-cache.outputs.cache-hit }}' '${{ steps.outputs-cache.outputs.cache-matched-key }}' | tee logs/module-cache.txt
      - name: Build and package device application
        run: |
          START=$(date +%s)
          bash scripts/build-ipa.sh
          ELAPSED=$(( $(date +%s) - START ))
          printf 'build_and_package_seconds=%s\nexact_cache_hit=%s\n' "$ELAPSED" '${{ steps.outputs-cache.outputs.cache-hit }}' | tee output/timing.txt
      - name: Save verified build outputs
        if: success() && steps.outputs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            upstream/**/build
            upstream/.gradle
            !upstream/.gradle/configuration-cache
          key: ${{ steps.build-cache.outputs.key }}
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FuoEvolve-iOS-unsigned
          path: output/*
          if-no-files-found: error
      - name: Publish verified unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="$VERSION"
          { printf '未签名 iPhone ARM64 IPA。包含 iOS 图标及网页登录修复，真机登录功能待用户验证。\n\n'; cat output/build-info.txt; } > release-notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite assets.'
            exit 1
          fi
          gh release create "$TAG" output/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FuoEvolve $VERSION iOS" --notes-file release-notes.md --prerelease --latest=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/*
          if-no-files-found: ignore
