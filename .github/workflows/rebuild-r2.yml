name: Rebuild and publish r2 IPA
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream tag, branch or commit
        default: 7e271c262c6c5495be5d1b680748ac4ba9e5bf0e
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    # Standard Intel runner has 14 GB RAM; target remains iPhone ARM64.
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 523727d1b65575a2241a3a57db2b0a674a82d340
          persist-credentials: false
      - name: Fetch upstream source
        uses: actions/checkout@v5
        with:
          repository: feeluown/FuoEvolve
          ref: ${{ inputs.upstream_ref }}
          path: upstream
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve upstream version
        id: version
        working-directory: upstream
        run: |
          TAG=$(git describe --tags --abbrev=0 HEAD)
          VERSION=${TAG#v}
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "UPSTREAM_VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          p=Path('iosApp/FuoEvolve/Info.plist')
          d=plistlib.loads(p.read_bytes())
          d['CFBundleVersion']='2'
          d['CFBundleShortVersionString']=os.environ.get('RESOLVED_VERSION', '') or __import__('subprocess').check_output(['git','describe','--tags','--abbrev=0','HEAD'],text=True).strip().removeprefix('v')
          p.write_bytes(plistlib.dumps(d))
          PY
      - name: Apply guarded iOS provider login fixes
        run: python3 scripts/patch-provider-login.py upstream
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('upstream/gradle/libs.versions.toml') }}
      - name: Configure Kotlin link memory
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8' 'org.gradle.workers.max=2' > ~/.gradle/gradle.properties
          sysctl hw.memsize
          cat ~/.gradle/gradle.properties
      - name: Prepare official iOS icon
        run: |
          python3 scripts/prepare-icon.py upstream
          ICON=upstream/iosApp/FuoEvolve/Assets.xcassets/AppIcon.appiconset
          sips -s format bmp "$ICON/source.png" --out "$RUNNER_TEMP/icon.bmp"
          sips -s format png "$RUNNER_TEMP/icon.bmp" --out "$ICON/AppIcon.png"
          rm "$ICON/source.png"
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$ICON/AppIcon.png"
          plutil -lint upstream/iosApp/FuoEvolve.xcodeproj/project.pbxproj
      - name: Identify exact build cache
        id: build-cache
        shell: bash
        env:
          PATCH_HASH: ${{ hashFiles('scripts/**', 'patches/**', '.github/workflows/build-ipa.yml') }}
        run: |
          SHA=$(git -C upstream rev-parse HEAD)
          TOOL_HASH=$( { xcodebuild -version; java -version 2>&1; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "key=ios-release-v1-${{ runner.os }}-${{ runner.arch }}-${SHA}-${TOOL_HASH}-${PATCH_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore exact-source build outputs
        id: outputs-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            upstream/**/build
            upstream/.gradle
            !upstream/.gradle/configuration-cache
          key: ${{ steps.build-cache.outputs.key }}
      - name: Build and package device application
        run: |
          START=$(date +%s)
          bash scripts/build-ipa.sh
          ELAPSED=$(( $(date +%s) - START ))
          printf 'build_and_package_seconds=%s\nexact_cache_hit=%s\n' "$ELAPSED" '${{ steps.outputs-cache.outputs.cache-hit }}' | tee output/timing.txt
      - name: Save verified build outputs
        if: success() && steps.outputs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            upstream/**/build
            upstream/.gradle
            !upstream/.gradle/configuration-cache
          key: ${{ steps.build-cache.outputs.key }}
      - name: Name and verify r2 package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, zipfile, plistlib, hashlib
          from pathlib import Path
          p=next(Path('output').glob('*.ipa'))
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              d=plistlib.loads(z.read('Payload/FuoEvolve.app/Info.plist'))
              assert d['CFBundleVersion']=='2'
              assert d['CFBundleShortVersionString']==os.environ['VERSION']
          q=p.with_name(f"FuoEvolve-{os.environ['VERSION']}-r2-iOS-unsigned.ipa")
          p.rename(q)
          Path('output/SHA256SUMS.txt').write_text(hashlib.sha256(q.read_bytes()).hexdigest()+'  '+q.name+'\n')
          PY
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FuoEvolve-r2
          path: output/*
          if-no-files-found: error
      - name: Publish r2 without replacing original
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${VERSION}-r2"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite existing r2 release'
            exit 1
          fi
          { printf '同一上游版本的第二次打包。App 版本不变，内部构建号为 2。未签名 iPhone ARM64 Release IPA。\n\n'; cat output/build-info.txt output/timing.txt; } > notes.md
          gh release create "$TAG" output/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FuoEvolve ${VERSION} iOS r2" --notes-file notes.md --prerelease --latest=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/*
          if-no-files-found: ignore
